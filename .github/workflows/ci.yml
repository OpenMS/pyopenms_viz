name: Windows Python 3.14 diagnostic
on: [push]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dependencies: [original, updated]
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.14"
      - name: Prepare diagnostic requirements
        if: matrix.dependencies == 'updated'
        run: |
          $requirements = Get-Content requirements.txt -Raw
          $requirements = $requirements.Replace('numpy==2.2.6', 'numpy==2.3.3').Replace('contourpy==1.3.2', 'contourpy==1.3.3')
          Set-Content requirements.txt $requirements
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.dependencies }}' -eq 'updated') {
            python -m pip install --only-binary=numpy,contourpy -r requirements.txt
          } else {
            python -m pip install -r requirements.txt
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze
      - name: Import NumPy
        continue-on-error: true
        run: python -X faulthandler -c "import numpy; print(numpy.__version__)"
      - name: Import pandas
        continue-on-error: true
        run: python -X faulthandler -c "import pandas; print(pandas.__version__)"
      - name: Import ContourPy
        continue-on-error: true
        run: python -X faulthandler -c "import contourpy; print(contourpy.__version__)"
      - name: Import Matplotlib
        continue-on-error: true
        run: python -X faulthandler -c "import matplotlib.pyplot; print('Matplotlib import succeeded')"
      - name: Run tests with crash reporting
        run: python -X faulthandler -m pytest -vv -s --snapshot-warn-unused test/

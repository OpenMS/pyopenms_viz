# Deploys documentation built by "Build Documentation" - only job with secrets/token access
name: Deploy Documentation
on:
  workflow_run:
    workflows: ["Build Documentation"]
    types: [completed]
  pull_request_target:
    types: [closed]
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  # Deploy to main GitHub Pages (only for main branch)
  deploy-main:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: documentation-${{ github.event.workflow_run.head_sha }}
          path: _build/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Deploy PR preview using subdirectories in gh_pages
  deploy-preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENMS_GITHUB_APP_ID }}
          private-key: ${{ secrets.OPENMS_GITHUB_APP_PRIVATE_KEY }}

      - name: Download PR number
        uses: actions/download-artifact@v4
        with:
          name: pr_number
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # pr_number.txt was written by a run of the PR's own (untrusted) code: accept
      # only a number, and only if that PR's head is the commit the docs were built from.
      - name: Get PR number
        id: pr_info
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(head -c 32 pr_number.txt | tr -d '[:space:]')"
          if ! [[ "$pr_number" =~ ^[0-9]{1,10}$ ]]; then
            echo "::error::pr_number artifact does not hold a PR number"
            exit 1
          fi
          pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq .head.sha)"
          if [ "$pr_head" != "$HEAD_SHA" ]; then
            echo "::warning::PR #${pr_number} head is ${pr_head}, docs were built from ${HEAD_SHA}; skipping this outdated or mismatched preview"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Checkout gh_pages branch
        if: steps.pr_info.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh_pages
          token: ${{ steps.app-token.outputs.token }}

      - name: Download build artifacts
        if: steps.pr_info.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: documentation-${{ github.event.workflow_run.head_sha }}
          path: _temp_build/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy PR preview to subdirectory
        if: steps.pr_info.outputs.deploy == 'true'
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_DIR="pr-${PR_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Previews of other PRs push to gh_pages at the same time (e.g. several
          # Dependabot PRs at once), so a push can be rejected. Each attempt starts
          # again from the latest gh_pages and replaces only this PR's directory.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --depth=1 origin gh_pages
            git reset --hard FETCH_HEAD
            rm -rf "$PR_DIR"
            mkdir -p "$PR_DIR"
            cp -r _temp_build/. "$PR_DIR/"
            git add -A "$PR_DIR"
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -q -m "Deploy PR #${PR_NUMBER} preview [skip ci]"
            if git push origin HEAD:gh_pages; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}), retrying on the latest gh_pages"
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::error::Could not push the preview of PR #${PR_NUMBER} to gh_pages"
          exit 1

      - name: Comment on PR with preview link
        if: steps.pr_info.outputs.deploy == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const previewUrl = `https://${repoOwner}.github.io/${repoName}/pr-${prNumber}/`;
            const marker = '<!-- docs-preview -->';

            // Find our earlier comment. It is posted with the GitHub App token, so its
            // author is the app's bot user, not github-actions[bot]. Older comments
            // have no marker, so also match their heading.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: repoOwner,
              repo: repoName,
              issue_number: prNumber,
              per_page: 100,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              (comment.body.includes(marker) || comment.body.includes('📖 **Documentation Preview**'))
            );

            const commentBody = `${marker}
            📖 **Documentation Preview**

            The documentation for this PR has been built and is available at:
            🔗 **[View Preview](${previewUrl})**

            This preview will be updated automatically when you push new commits to this PR.

            ---
            *Preview built from commit: \`${headSha.substring(0, 7)}\`*`;

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: repoOwner,
                repo: repoName,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: prNumber,
                body: commentBody
              });
            }

  # Cleanup old PR preview branches - safe on pull_request_target since it never runs fork code
  cleanup-previews:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENMS_GITHUB_APP_ID }}
          private-key: ${{ secrets.OPENMS_GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Delete PR preview directory
        env:
          PR_NUMBER: ${{ github.event.number }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_DIR="pr-${PR_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Retry on the latest gh_pages if a preview deploy pushed in between.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin gh_pages
            git checkout -q -B gh_pages FETCH_HEAD
            if [ ! -d "$PR_DIR" ]; then
              echo "Preview directory $PR_DIR not found"
              exit 0
            fi
            git rm -r -q "$PR_DIR"
            git commit -q -m "Remove PR #${PR_NUMBER} preview [skip ci]"
            if git push origin gh_pages; then
              echo "Deleted preview directory: $PR_DIR"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}), retrying on the latest gh_pages"
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::error::Could not remove the preview of PR #${PR_NUMBER} from gh_pages"
          exit 1

      - name: Comment cleanup notification
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const prNumber = context.payload.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🧹 **Preview Cleanup**
              
              The documentation preview for this PR has been cleaned up and is no longer available.`
            });
